name: test-aidia

services:
  postgres:
    image: postgres:16-alpine
    container_name: birthday-newsletter-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birthday_newsletter}
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birthday-newsletter-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-birthday_newsletter}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      NEWSLETTER_CRON: "${NEWSLETTER_CRON:-0 0 8 * * *}"
      NEWSLETTER_ZONE: ${NEWSLETTER_ZONE:-Europe/Rome}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
